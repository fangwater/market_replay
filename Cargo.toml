[workspace]
resolver = "2"
members = [
    "crates/core/cn_futures_core",
    "crates/mdl_replay",
    "crates/cn/cn_futures_l2",
    "crates/cn/cn_futures_trim",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde_json = "1.0"

# Same release profile as /home/fanghaizhou/mkt_signal/Cargo.toml.
[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 4
