[workspace]
resolver = "2"
members = [
    "crates/core/cn_futures_core",
    "crates/common/dingtalk",
    "crates/common/safe_replace",
    "crates/proto/cn_market_proto",
    "crates/cn/cn_daily",
    "crates/cn/cn_kline_server",
    "crates/server/market_replay_server",
    "crates/mdl_replay",
    "crates/cn/cn_futures_l2",
    "crates/cn/cn_futures_trim",
    "crates/cn/cn_futures_roll",
    "crates/cn/cn_hfq_bars",
    "crates/core/cme_roll_metadata",
    "crates/cme/cme_tas_replay",
    "crates/cme/lseg_delivery",
    "crates/cme/ib_kline_export",
    "crates/cme/lseg_daily",
    "crates/usstock/usstock_replay",
    "crates/usstock/usstock_lseg_mbp_replay",
    "crates/usstock/usstock_lseg_raw_replay",
    "crates/usstock/usstock_lseg_rawll2_replay",
    "crates/usstock/usstock_nasdaq_baseline",
    "crates/usstock/usstock_aggregate_baseline",
    "crates/web/data_dashboard",
    "crates/ref/cn_reference",
    "crates/backtest/cn_futures_backtest",
    "crates/web/backtest_workbench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0"
serde_json = "1.0"

# Same release profile as /home/fanghaizhou/mkt_signal/Cargo.toml.
[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 4
