[package]
name = "market_replay_server"
version.workspace = true
edition.workspace = true
description = "One server for market_replay: CN market gRPC + HTTP, supervised services and scheduled daily jobs"

[[bin]]
name = "market-replay-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
cn_kline_server = { path = "../../cn/cn_kline_server" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "fs", "io-util"] }
toml = "0.8"
tonic = "0.14"

[dev-dependencies]
tempfile = "3"
