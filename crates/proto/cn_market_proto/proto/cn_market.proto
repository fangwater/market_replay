// CN futures post-market market data, served by market_replay.
// Futures-native contract (no Binance compatibility): every field carries
// explicit units. Times are UTC Unix milliseconds; trading days are YYYYMMDD
// integers in Asia/Shanghai exchange convention (night session belongs to the
// next trading day).
syntax = "proto3";

package cn_market.v1;

service CnFuturesMarket {
  // Closed one-minute bars of one contract from baseline_data_1min.
  rpc GetMinuteBars(GetMinuteBarsRequest) returns (GetMinuteBarsResponse);
  // Closed, additive-back-adjusted minutes for the historical dominant of a product.
  rpc GetHfqMinuteBars(GetHfqMinuteBarsRequest) returns (GetHfqMinuteBarsResponse);
  // Which trading days are available. With an exchange, also how far the
  // in-progress day has been read from NFS for that exchange (cheap to poll).
  rpc GetDataState(GetDataStateRequest) returns (DataState);
  // P50 / P90 for classifying trades by size, per product and month.
  rpc GetSizeThresholds(GetSizeThresholdsRequest) returns (GetSizeThresholdsResponse);
  // Continuous-trading windows per product.
  rpc GetTradingSessions(GetTradingSessionsRequest) returns (GetTradingSessionsResponse);
  // Effective contract choices based on the preceding trading day's close.
  rpc GetContractSelections(GetContractSelectionsRequest) returns (GetContractSelectionsResponse);
  // Verified authoritative multipliers; no client-side database access.
  rpc GetProductMultipliers(GetProductMultipliersRequest) returns (GetProductMultipliersResponse);
  // Historical raw MDL frames with the replay plan's clock and source order.
  rpc StreamReplayFrames(GetReplayFramesRequest) returns (stream ReplayFrameBatch);
  // Durable intraday MDL frames, in native channel order. A bounded replay
  // ends at a fixed live watermark; clients overlap it with their ZMQ buffer.
  rpc StreamIntradayFrames(GetIntradayFramesRequest) returns (stream IntradayFrameBatch);
}

enum ContractSelectionMode {
  CONTRACT_SELECTION_MODE_UNSPECIFIED = 0;
  DOMINANT = 1;
  SECONDARY_OI = 2;
  FAR_SECONDARY_OI = 3;
  NEAR_SECONDARY_OI = 4;
  VOLUME_SECOND = 5;
}

message GetContractSelectionsRequest {
  // Unspecified = all exchanges. Products are case-insensitive.
  Exchange exchange = 1;
  repeated string products = 2;
  ContractSelectionMode mode = 3;
  // Both zero = latest published day per product; otherwise inclusive,
  // YYYYMMDD, at most 31 calendar days between the bounds.
  uint32 start_trading_day = 4;
  uint32 end_trading_day = 5;
}

message SelectedContract {
  // Empty with unavailable_reason set means there is no eligible contract.
  string contract = 1;
  uint32 ranking_source_day = 2;
  optional double open_interest = 3;
  optional double volume_lots = 4;
  string unavailable_reason = 5;
}

message ContractSelection {
  Exchange exchange = 1;
  string product = 2;
  uint32 trading_day = 3;
  string dominant = 4;
  SelectedContract selected = 5;
  // Known only AFTER trading_day close; NEVER the effective choice above.
  SelectedContract scheduled_next = 6;
  string dominant_rule = 7;
}

message GetContractSelectionsResponse {
  ContractSelectionMode mode = 1;
  repeated ContractSelection rows = 2;
  string rule_version = 3;
  // SHA-256 of mode, rule version and returned rows; save with a run.
  string snapshot_id = 4;
}

message GetProductMultipliersRequest { repeated string products = 1; }
message VerifiedProductMultiplier {
  string product = 1;
  Exchange exchange = 2;
  double volume_multiple = 3;
}
message GetProductMultipliersResponse {
  repeated VerifiedProductMultiplier products = 1;
  string source = 2;
}

message GetReplayFramesRequest {
  uint32 trading_day = 1;
  repeated string contracts = 2;
  repeated Exchange exchanges = 3;
  bool allow_partial = 4;
}
message ReplayFrame {
  bytes payload = 1;
  uint64 cursor = 2;
  // Natural source date + channel-prefix-max LocalTime, in UTC microseconds.
  int64 baseline_us = 3;
  uint32 source_day = 4;
  string channel = 5;
  uint64 source_row = 6;
}
message ReplayFrameBatch {
  repeated ReplayFrame frames = 1;
  // First batch contains bounds/plan/source metadata; no local client paths.
  string manifest_json = 2;
  // Required final marker after source stability checks. Without it, fail.
  bool complete = 3;
  uint64 frame_count = 4;
  string frames_sha256 = 5;
}

message GetIntradayFramesRequest {
  Exchange exchange = 1;
  string contract = 2;
  uint32 trading_day = 3;
  // Last closed historical minute's end. Coverage must bridge this point.
  int64 historical_end_ms = 4;
  // Opaque native-order cursor returned by an earlier complete batch.
  string after_cursor = 5;
}

message IntradayFrame {
  // Exact `<topic> || <CSV original row>` bytes. No synthetic quotes.
  bytes payload = 1;
  string cursor = 2;
  uint64 received_us = 3;
}

message IntradayCoverage {
  bool ready = 1;
  uint64 source_generation = 2;
  uint64 connected_since_us = 3;
  uint64 last_live_received_us = 4;
  int64 disk_overlap_us = 5;
  string reason = 6;
}

message IntradayFrameBatch {
  repeated IntradayFrame frames = 1;
  string next_cursor = 2;
  // Final marker for this fixed snapshot. Required before any live handoff.
  bool complete = 3;
  IntradayCoverage coverage = 4;
}

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  CFFEX = 1;
  SHFE = 2;
  INE = 3;
  CZCE = 4;
  DCE = 5;
  GFEX = 6;
}

message TimeRange {
  // Inclusive bounds on bar open time.
  int64 start_ms = 1;
  int64 end_ms = 2;
}

message GetMinuteBarsRequest {
  Exchange exchange = 1;
  // Native contract code, case-insensitive. CZCE accepts both AP601 and AP2601.
  string contract = 2;
  oneof range {
    uint32 trading_day = 3;
    TimeRange time = 4;
  }
  // Return the synthesized baseline's zero-volume minutes as well. Required
  // for source-consecutive hourly aggregation; no new minutes are invented.
  bool include_empty_minutes = 5;
}

message GetHfqMinuteBarsRequest {
  Exchange exchange = 1;
  string product = 2;
  TimeRange time = 3;
  // Empty for the first page. Subsequent pages must repeat the returned generation.
  string generation = 4;
}

message GetHfqMinuteBarsResponse {
  // Stable across all pages of one published archive.
  string generation = 1;
  uint32 basis_trading_day = 2;
  uint32 last_trading_day = 3;
  string last_contract = 4;
  double volume_multiple = 5;
  // OHLC, all VWAP variants, mid and depth prices are additive HFQ.
  // Lots, turnover and size buckets retain their original native units.
  // These are archived bars. high/low equal snapshot_high/snapshot_low.
  repeated MinuteBar bars = 6;
  // If a new main is scheduled, its name and the previous reference close
  // spread to add to this archive before warming on the new contract's scale.
  optional string scheduled_next = 7;
  optional double next_gap = 8;
}

message Contract {
  Exchange exchange = 1;
  // Upper-case product code, e.g. RB, AP, IF.
  string product = 2;
  // Code as stored in the archive (CZCE keeps 3-digit YMM).
  string native_code = 3;
  // Lower-case, CZCE widened to 4 digits: ap2601, rb2601.
  string canonical_code = 4;
  // From PostgreSQL market_metadata.public.domestic_future_product_multipliers.
  double volume_multiple = 5;
  // Minimum price increment (OpenCTP broker reference via the reference service).
  double price_tick = 6;
  // "instrument" or "product" (all listed contracts of the product agree).
  string price_tick_source = 7;
}

message MinuteBar {
  int64 open_time_ms = 1;
  uint32 trading_day = 2;
  // OHLC in quote units. For requested empty minutes, a missing baseline
  // price remains NaN. high/low are widened, on the tick grid, to contain
  // vwap when the snapshot-derived range misses trades between snapshots.
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  // high/low exactly as derived from 5-level snapshots (baseline_data_1min).
  double snapshot_high = 7;
  double snapshot_low = 8;
  // Single-sided lots traded in [open_time, open_time + 60s).
  double volume_lots = 9;
  // Single-sided turnover in CNY, contract multiplier included.
  double turnover_cny = 10;
  // turnover_cny / volume_lots / volume_multiple.
  double vwap = 11;
  // Number of snapshot intervals with a volume increase (not real trade count).
  uint32 snapshot_trades = 12;
  bool widened = 13;
  // (bid0 + ask0) / 2 of the last two-sided 5-level snapshot inside the
  // minute (baseline_data_1min mid_price; i.e. the mid at the bar close, not
  // the causal prior at open_time). Unset when the minute had no two-sided
  // book.
  optional double mid_price = 14;

  // ---- Remaining baseline_data_1min columns (2026-11-16). Same values as the
  // parquet; turnover is CNY with the multiplier, prices are quote units. All
  // splits come from differencing adjacent snapshots' cumulative volume /
  // turnover into one inferred interval trade; the side is the snapshot
  // aggressor inference, unknown sides split 50/50.
  // Last-print time-weighted price inside the minute.
  optional double twap = 15;
  double buy_volume_lots = 16;
  double sell_volume_lots = 17;
  double buy_turnover_cny = 18;
  double sell_turnover_cny = 19;
  optional double buy_vwap = 20;
  optional double sell_vwap = 21;
  // Snapshot intervals classified buy / sell (not real trade counts).
  double buy_snapshot_trades = 22;
  double sell_snapshot_trades = 23;
  // turnover_cny / snapshot_trades.
  double avg_interval_turnover_cny = 24;
  double net_buy_turnover_cny = 25;
  double net_buy_volume_lots = 26;
  // net_buy_turnover_cny / turnover_cny.
  optional double net_buy_pct = 27;
  SizeBuckets size_buckets = 28;
  // Last two-sided 5-level book inside the minute; unset if none.
  optional Book5 book = 29;
  // True for bars rebuilt from the in-progress day's NFS MDL files (not yet in
  // the archive). A bar is final once open_time_ms + 60000 <=
  // DataState.live_through_ms; later ones can still change as NFS catches up.
  // size_buckets is unset when the product has no threshold for the month.
  bool provisional = 30;
}

// Interval-turnover classes, NOT real order sizes: each inferred interval
// trade is classed by its turnover against the product's P50 / P90 (>= P90
// large, [P50, P90) medium, < P50 small). Rule for the published minute
// archives from 2026-01-01 and for live bars: P50 / P90 of the interval turnover of the
// dominant contract of each trading day (merged across rolls) over the
// complete PRECEDING Shanghai calendar month, applied to each trade by the
// month of its Shanghai timestamp. Known in advance, causal. Archives before
// 2026 use the older rule (same month, all contracts pooled). The
// numbers in force are in GetMinuteBarsResponse.size_thresholds.
message SizeBuckets {
  double large_turnover_cny = 1;
  double medium_turnover_cny = 2;
  double small_turnover_cny = 3;
  double large_buy_cny = 4;
  double large_sell_cny = 5;
  double medium_buy_cny = 6;
  double medium_sell_cny = 7;
  double small_buy_cny = 8;
  double small_sell_cny = 9;
  double net_buy_large_cny = 10;
  double net_buy_medium_cny = 11;
  double net_buy_small_cny = 12;
}

message BookLevel {
  optional double price = 1;
  optional double volume_lots = 2;
}

// Five levels each, index 0 = best.
message Book5 {
  repeated BookLevel bids = 1;
  repeated BookLevel asks = 2;
}

message GetMinuteBarsResponse {
  Contract contract = 1;
  // Ascending baseline minutes. Zero-volume rows are returned only when
  // include_empty_minutes is set; absent source minutes remain omitted.
  repeated MinuteBar bars = 2;
  DataState data_state = 3;
}

message GetSizeThresholdsRequest {
  Exchange exchange = 1;
  // Upper-case product code (RB, AP, IF). Empty = every product of the exchange.
  string product = 2;
}

message GetSizeThresholdsResponse {
  repeated ProductThresholds products = 1;
}

message ProductThresholds {
  string product = 1;
  // The current Shanghai month and, once known, the next one (a night session
  // can cross a month end). A month without an entry has no threshold: do not
  // classify trades in it.
  repeated SizeThreshold thresholds = 2;
}

message SizeThreshold {
  // Shanghai calendar month of the trades classified, YYYYMM (e.g. 202611).
  uint32 applies_month = 1;
  // Interval turnover in CNY, contract multiplier included.
  double p50_turnover_cny = 2;
  double p90_turnover_cny = 3;
}

message GetTradingSessionsRequest {
  Exchange exchange = 1;
  // Empty = every product of the exchange.
  string product = 2;
}

message GetTradingSessionsResponse {
  // Session snapshot the windows come from (same value as
  // DataState.session_snapshot_as_of).
  string snapshot_as_of = 1;
  repeated ProductSessions products = 2;
}

message ProductSessions {
  string product = 1;
  // Active continuous windows, in segment order.
  repeated SessionWindow windows = 2;
}

// Asia/Shanghai seconds since midnight; end exclusive. end_sec <= begin_sec
// means the window runs past midnight (night session).
message SessionWindow {
  uint32 begin_sec = 1;
  uint32 end_sec = 2;
}

message GetDataStateRequest {
  // Optional. When set, live_trading_day / live_through_ms describe this
  // exchange; unset leaves them 0.
  Exchange exchange = 1;
}

message DataState {
  // "baseline_data_1min"
  string source = 1;
  // Latest trading day processed by the daily job (0 if unknown).
  uint32 latest_trading_day = 2;
  // Continuous-session snapshot used to trim the archive and in `sessions`.
  string session_snapshot_as_of = 3;
  // In-progress trading day served from NFS MDL (0 if none) and the newest
  // snapshot time (UTC ms) read for the requested exchange. Minutes with
  // open_time + 60 s <= live_through_ms are final; the rest come from the
  // client's own feed.
  uint32 live_trading_day = 4;
  int64 live_through_ms = 5;
}
