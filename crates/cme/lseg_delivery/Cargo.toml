[package]
name = "lseg_delivery"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
arrow-array = "=54.3.1"
arrow-schema = "=54.3.1"
clap = { version = "4", features = ["derive"] }
parquet = { version = "=54.3.1", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1"
rocksdb = { version = "=0.25.0", default-features = false, features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cme_tas_replay = { path = "../cme_tas_replay" }
chrono = "0.4"
crossbeam-channel = "0.5"
csv = "1.3"
csv-core = "0.1"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
log = "0.4"
libc = "0.2"
env_logger = "0.10"
mimalloc = "0.1"
toml = "0.8"
zstd = "0.13"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "sqlite-bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
regex = "1"
arrow-select = "=54.3.1"
safe_replace = { path = "../../common/safe_replace" }


[dev-dependencies]
tempfile = "3"
