[package]
name = "cme_roll"
version.workspace = true
edition.workspace = true
description = "Unified CME dominant-contract rule (OI 1.1x, forward only, deadline guard); see docs/cme_roll.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cme_roll_evidence"
path = "src/bin/cme_roll_evidence.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
env_logger = "0.10"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
