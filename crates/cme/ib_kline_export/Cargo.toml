[package]
name = "ib_kline_export"
version.workspace = true
edition.workspace = true
description = "Raw IB minute export to per-RIC / per-UTC-day kline_ib.parquet (snapshot backfill and MySQL incremental)"

[[bin]]
name = "ib_kline_export"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arrow-array = "=54.3.1"
arrow-schema = "=54.3.1"
arrow-select = "=54.3.1"
parquet = { version = "=54.3.1", default-features = false, features = ["arrow", "zstd", "snap"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
futures-util = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "sqlite-bundled"] }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
