[package]
name = "lseg_daily"
version.workspace = true
edition.workspace = true
description = "Daily LSEG TAS job: remote listing -> direct download -> stage/replay/audit -> ric-day parquet + status + klines on the delivery disk -> IB step -> catalog; DingTalk summary"

[[bin]]
name = "lseg-daily"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
dingtalk = { path = "../../common/dingtalk" }
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
arrow-schema = "=54.3.1"
parquet = { version = "=54.3.1", default-features = false, features = ["arrow", "zstd", "snap"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
