[package]
name = "data_dashboard"
version.workspace = true
edition.workspace = true
description = "Read-only web dashboard: processing progress and product search (数据处理进度与品种查询)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "data-dashboard"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
reqwest = { version = "0.12.19", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
