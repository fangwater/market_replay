<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>期货回测工作台</title>
<style>:root{font:15px system-ui;color:#dce6ef;background:#101922}body{max-width:1450px;margin:auto;padding:28px}h1{font-size:25px}h2{font-size:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.muted{color:#91a3b4;font-size:13px}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.card{background:#192631;padding:22px;border:1px solid #2e414f;border-radius:12px;margin-bottom:18px}label{display:block;margin:14px 0 6px}input,select,textarea,button{box-sizing:border-box;font:inherit;color:inherit;background:#101c26;border:1px solid #3b5363;border-radius:6px;padding:9px}input,select,textarea{width:100%}button{cursor:pointer;margin:8px 8px 0 0}button.primary{background:#1a766d;border-color:#2cbaaa}button:hover{border-color:#71d6ca}textarea{height:240px;font:12px monospace}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #30414d}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#243a48}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.metrics{display:flex;gap:14px;flex-wrap:wrap}.metric{padding:14px;background:#11212d;border-radius:7px;min-width:120px}.metric strong{display:block;font-size:21px;color:#71d6ca}svg{width:100%;height:190px;background:#101c26;border-radius:6px}#message{color:#f0b764;white-space:pre-wrap}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}body{padding:14px}table{font-size:11px}td,th{padding:6px}}</style>
<header><div><h1>期货回测工作台</h1><div class="muted">CN Futures · 分钟目标仓位 · Maker / Taker · 独立换月成本研究</div></div><a href="/" style="color:#71d6ca">数据看板</a></header>
<div id="message"></div><div class="grid"><aside><div class="card"><h2>创建实验</h2>
<label>任务</label><select id="task"><option value="execute">仓位执行回测</option><option value="convert">生成按手仓位及成本估计</option><option value="roll_cost">独立换月回测</option></select>
<label>仓位 Parquet</label><input id="input"><button id="inspect">检查格式</button>
<label>本金（人民币元）</label><input id="capital" type="number" value="5000000">
<label>品种（逗号分隔；空为文件全部品种）</label><input id="products" value="RB,SN">
<label>交易日范围</label><input id="start" type="date"><input id="end" type="date" style="margin-top:6px">
<label>成交方式</label><select id="execution"><option value="maker">Maker：严格击穿</option><option value="taker">Taker：对手盘 IOC</option></select>
<label>额外行情延迟（毫秒）</label><input id="delay" type="number" min="0" value="0">
<div id="rollfields" class="hidden"><label>旧合约 / 新合约</label><input id="old" placeholder="rb2701"><input id="new" placeholder="rb2705" style="margin-top:6px"><label>旧仓手数（空头填负数）</label><input id="lots" type="number" value="10"><label>最大敞口偏离（人民币元）</label><input id="deviation" type="number" value="100000"><label>价差改善门槛（tick）</label><input id="spread" type="number" value="0"><label>窗口（北京时间，可留空使用整交易日）</label><input id="begin" placeholder="2026-11-13 09:00:00"><input id="deadline" placeholder="2026-11-13 10:00:00" style="margin-top:6px"></div>
<details><summary style="margin-top:18px;cursor:pointer">全部参数（JSON）</summary><p class="muted">高级参数先在此修改，再点击“应用高级参数”；金额默认按文件原值 × 本金。</p><textarea id="advanced"></textarea><button id="apply">应用高级参数</button></details><button class="primary" id="submit">创建并排队</button><p class="muted">任务由统一服务队列执行。独立启动页面时，也可使用 cn-backtest worker 处理待办。</p></div></aside>
<main><div class="card"><h2>运行与比较</h2><div class="muted">勾选多次运行可并列比较；点击一行查看明细。</div><button id="refresh">刷新</button><button id="compare">比较选中</button><div style="overflow:auto"><table><thead><tr><th></th><th>运行</th><th>状态</th><th>成交手数</th><th>手续费</th><th>未完成手数</th></tr></thead><tbody id="runs"></tbody></table></div></div>
<div class="card" id="details"><h2>实验结果</h2><div class="muted">选择一次运行查看结果。</div></div><div class="card hidden" id="comparison"></div></main></div>
<script>
const $=x=>document.getElementById(x);let cfg={},runs=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>x==null?'未知':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2});
async function api(path,method='GET',body){const r=await fetch('/api/backtest/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||JSON.stringify(v));return v}function error(e){$('message').textContent=e.message||e}function guard(fn){return async()=>{try{$('message').textContent='';await fn()}catch(e){error(e)}}}
function fill(){for(const[id,key]of[['input','input'],['capital','capital_cny'],['start','start'],['end','end'],['task','task'],['execution','execution'],['delay','md_delay_ms']])$(id).value=cfg[key];$('products').value=cfg.products.join(',');for(const[id,key]of[['old','old_contract'],['new','new_contract'],['lots','initial_lots'],['deviation','max_exposure_deviation_cny'],['spread','spread_improvement_ticks'],['begin','begin'],['deadline','deadline']])$(id).value=cfg.roll[key]??'';$('advanced').value=JSON.stringify(cfg,null,2);$('rollfields').classList.toggle('hidden',cfg.task!=='roll_cost')}
function form(){let c=structuredClone(cfg);for(const[id,key]of[['input','input'],['start','start'],['end','end'],['task','task'],['execution','execution']])c[key]=$(id).value;c.capital_cny=Number($('capital').value);c.md_delay_ms=Number($('delay').value);c.products=$('products').value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);for(const[id,key]of[['old','old_contract'],['new','new_contract']])c.roll[key]=$(id).value;for(const[id,key]of[['lots','initial_lots'],['deviation','max_exposure_deviation_cny'],['spread','spread_improvement_ticks']])c.roll[key]=Number($(id).value);for(const[id,key]of[['begin','begin'],['deadline','deadline']])c.roll[key]=$(id).value||null;return c}
async function refresh(){runs=await api('runs');$('runs').innerHTML=runs.map(r=>`<tr data-id="${esc(r.id)}"><td><input type="checkbox" class="pick" value="${esc(r.id)}" style="width:auto"></td><td>${esc(r.id.slice(0,23))}</td><td>${esc(r.state)}</td><td>${num(r.summary?.filled_lots)}</td><td>${num(r.summary?.fees_cny)}</td><td>${num(r.summary?.unfilled_lots)}</td></tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=e=>{if(e.target.type!=='checkbox')guard(()=>detail(tr.dataset.id))()})}
function plot(rows,key,label){const pts=rows.filter(r=>r[key]!=null);if(pts.length<2)return `<p class="muted">${label}：暂无曲线</p>`;let min=Math.min(...pts.map(r=>r[key])),max=Math.max(...pts.map(r=>r[key]));const t0=pts[0].timestamp_us,t1=pts.at(-1).timestamp_us;const path=pts.map((r,i)=>`${i?'L':'M'}${20+960*(r.timestamp_us-t0)/(t1-t0||1)},${160-140*(r[key]-min)/(max-min||1)}`).join(' ');return `<p>${label} <span class="muted">${num(min)} ～ ${num(max)}</span></p><svg viewBox="0 0 1000 190"><path d="${path}" fill="none" stroke="#71d6ca" stroke-width="2"/><text x="20" y="183" fill="#91a3b4">${esc(new Date(t0/1000).toLocaleString())}</text><text x="700" y="183" fill="#91a3b4">${esc(new Date(t1/1000).toLocaleString())}</text></svg>`}
async function detail(id){const r=await api('runs/'+id),s=r.status.summary;let html=`<h2>${esc(id)}</h2><p>${esc(r.status.state)}</p>`;if(r.status.error)html+=`<pre>${esc(r.status.error)}</pre>`;if(s){html+='<div class="metrics">'+[['手续费',s.fees_cny],['执行价格成本',s.execution_shortfall_cny],['未完成手数',s.unfilled_lots],['最大敞口偏离',s.max_exposure_deviation_cny],['净盈亏',s.net_pnl_cny]].map(([k,v])=>`<div class="metric"><strong>${num(v)}</strong>${k}</div>`).join('')+'</div>';const eq=await api(`runs/${id}/tables/equity?sample=1000`);html+=plot(eq.rows,'value','MTM 权益（人民币元）');if(r.config.task==='roll_cost'){const risk=await api(`runs/${id}/tables/roll_exposure?sample=1000`);html+=plot(risk.rows,'value','换月敞口偏离（人民币元）')}html+='<h3>持仓与目标</h3><pre>'+esc(JSON.stringify({actual:s.positions,target:s.targets},null,2))+'</pre>'}html+=`<button id="cancelrun">取消任务</button><label>审计明细</label><select id="tablekind">${['fills','orders','target_lots','cost_estimate','roll_batches','roll_exposure','positions'].map(x=>`<option>${x}</option>`).join('')}</select><button id="loadtable">读取明细</button><button id="nexttable">下一页</button><pre id="tablerows"></pre><details><summary>配置与数据来源</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>`;$('details').innerHTML=html;$('cancelrun').onclick=guard(async()=>{await api(`runs/${id}/cancel`,'POST');await refresh();await detail(id)});let offset=0;async function load(){const t=await api(`runs/${id}/tables/${$('tablekind').value}?offset=${offset}&limit=50`);$('tablerows').textContent=`第 ${offset+1} 起，共 ${t.total} 行\n`+JSON.stringify(t.rows,null,2)}$('loadtable').onclick=guard(async()=>{offset=0;await load()});$('nexttable').onclick=guard(async()=>{offset+=50;await load()})}
$('task').onchange=()=>{$('rollfields').classList.toggle('hidden',$('task').value!=='roll_cost')};$('apply').onclick=guard(async()=>{cfg=JSON.parse($('advanced').value);fill()});$('inspect').onclick=guard(async()=>{$('message').textContent='正在扫描输入…';const r=await api('inspect','POST',{path:$('input').value});$('message').textContent=JSON.stringify(r,null,2)});$('submit').onclick=guard(async()=>{const r=await api('runs','POST',form());$('message').textContent='已排队：'+r.id;await refresh()});$('refresh').onclick=guard(refresh);$('compare').onclick=()=>{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);const keys=['filled_lots','fees_cny','execution_shortfall_cny','unfilled_lots','roll_complete','max_exposure_deviation_cny','exposure_deviation_cny_seconds'];$('comparison').classList.remove('hidden');$('comparison').innerHTML='<h2>参数结果比较</h2><div style="overflow:auto"><table><thead><tr><th>指标</th>'+ids.map(x=>'<th>'+esc(x.slice(0,23))+'</th>').join('')+'</tr></thead><tbody>'+keys.map(k=>'<tr><td>'+k+'</td>'+ids.map(id=>{const v=runs.find(r=>r.id===id)?.summary?.[k];return '<td>'+(typeof v==='boolean'?(v?'完成':'未完成'):num(v))+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>'};guard(async()=>{cfg=await api('config');fill();await refresh()})();setInterval(()=>guard(refresh)(),5000);
</script></html>
