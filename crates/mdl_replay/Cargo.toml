[package]
name = "mdl_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mdl-replay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
zmq = "0.10"
zmq-sys = "0.12"

[dev-dependencies]
tempfile = "3"
