[package]
name = "cn_reference"
version.workspace = true
edition.workspace = true
description = "CN futures reference data (OpenCTP fees and continuous sessions): incremental PostgreSQL store, /api/v1 HTTP, daily sync"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cn-reference"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dingtalk = { path = "../../common/dingtalk" }
encoding_rs = "0.8"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12.19", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
