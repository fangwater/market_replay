[package]
name = "cn_kline_server"
version.workspace = true
edition.workspace = true
description = "gRPC (cn_market.v1) minute bars for CN futures read from baseline_data_1min"

[[bin]]
name = "cn-kline-server"
path = "src/main.rs"

[[bin]]
name = "cn-minute-cache"
path = "src/minute_cache_main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
cn_futures_core = { path = "../../core/cn_futures_core" }
cn_futures_l2 = { path = "../cn_futures_l2" }
cn_futures_trim = { path = "../cn_futures_trim" }
cn_futures_roll = { path = "../cn_futures_roll" }
cn_market_proto = { path = "../../proto/cn_market_proto" }
mdl_replay = { path = "../../mdl_replay" }
prost = "0.14"
rocksdb = { version = "0.25", default-features = false, features = ["lz4"] }
csv = "1.3"
reqwest = { version = "0.12.19", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "0.8"
tonic = "0.14"
tokio-stream = "0.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
sha2 = "0.10"
futures-util = "0.3"
zmq = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
