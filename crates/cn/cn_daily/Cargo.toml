[package]
name = "cn_daily"
version.workspace = true
edition.workspace = true
description = "Daily CN futures post-market job: RocksDB replay -> baseline_data_1min (export, session trim, size buckets) -> audit -> DingTalk"

[[bin]]
name = "cn-daily"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
cn_futures_l2 = { path = "../cn_futures_l2" }
dingtalk = { path = "../../common/dingtalk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
