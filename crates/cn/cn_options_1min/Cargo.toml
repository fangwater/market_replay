[package]
name = "cn_options_1min"
version.workspace = true
edition.workspace = true
description = "CN commodity options 1-minute baseline parquet cleaner (historical zip + daily Tonglian MDL)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cn-options-1min"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "=54.3.1"
arrow-schema = "=54.3.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
dingtalk = { path = "../../common/dingtalk" }
parquet = { version = "=54.3.1", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.10"
reqwest = { version = "0.12.19", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
