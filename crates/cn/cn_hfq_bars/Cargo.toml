[package]
name = "cn_hfq_bars"
version.workspace = true
edition.workspace = true
description = "Daily incremental CN HFQ coarse bars (5min / 15min / 1h / 1day) from baseline_data_1min_hfq"

[[bin]]
name = "cn-hfq-bars"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "=54.3.1"
arrow-schema = "=54.3.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
parquet = { version = "=54.3.1", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
