# Dashboard 数据处理进度与品种查询 (read-only). Served by market-replay-server
# on its HTTP port (UI at /, APIs at /api/dashboard/*; see
# config/market_replay_server.toml [dashboard]). `listen` / `workers` apply
# only to the standalone `data-dashboard` binary.
# Nothing here is ever written by the dashboard: NFS, PostgreSQL (read-only
# transactions via psql), catalog.sqlite (opened read_only + immutable),
# state / log files of other jobs are only read.
listen = "0.0.0.0:18320"
# Runtime worker threads (the blocking pool is capped at the same size).
workers = 2
# Concurrent filesystem / subprocess jobs started by drill-down requests.
io_permits = 4

[cn]
cn_daily_config = "/home/fanghaizhou/market_replay/config/cn_daily.toml"
dominant_api = "http://127.0.0.1:18313"
psql = "/mnt/nvme-raid0-28t/apps/pgsql16/bin/psql"
pg_host = "/mnt/nvme-raid0-28t/fanghaizhou/postgresql/domestic_futures/16/run"
pg_port = 5433
pg_db = "market_metadata"
pg_user = "u171"

[lseg]
catalog = "/mnt/nfs/30.100_cta_data/lseg/meta/catalog.sqlite"
problems_dir = "/mnt/nfs/30.100_cta_data/lseg/meta/problems"
# lseg-daily driver state (shown as 未部署 until it exists).
lseg_daily_state = "/mnt/nvme-raid0-28t/fanghaizhou/lseg_data/runtime/lseg_daily/state.json"

[ib]
