# 品种中文名表（数据看板 data_dashboard 读取，只读）。
#
# 优先级：本文件的 [[...]] 明确条目 > 本文件的 pattern 规则 > 编译进二进制的
# 名称来源（国内期货：cn_futures_reference.instrument_versions 的 OpenCTP 名称；
# 海外：scripts/lseg/make_futures_checklist_excel.py 的 PRODUCTS 表，经 IB 代码对应）。
# 本文件缺失、解析失败或某个品种不在这里时，看板继续用编译进去的名称，并把
# 加载错误显示在“名称覆盖”告警里。改完后重启 market-replay-server 生效。
#
# 字段：
#   market    cn / lseg / ib（看板的三个市场）
#   code      看板里的品种代码：国内为交易所品种代码（大写），LSEG 为 catalog.sqlite
#             contracts.product，IB 为 ib_contracts.ib_symbol。区分大小写。
#   name_cn   中文名（必填）
#   name_en   英文名（可选；有值时替换 LSEG 描述推出的英文名）
#   exchange  交易所（可选，仅说明用）
#   category  类别（可选；与 PRODUCTS 表口径一致：股指、利率、外汇、能源、农产品……）
#   source    名称依据，必须是以下之一：
#     exchange_cn_page          交易所官方中文页面上的名称
#     industry_standard         合约身份由 LSEG 描述/RIC 根唯一确定，中文名用业内通行译名
#     derived_from_description  没有通行中文名，按 LSEG 描述直译拼出（规格/条带等变体）
#     derived_from_data         LSEG 无参考描述，从 RIC 写法或价格水平推断，**待核实**
#     local_record              本机已有的书面记录（注明出处）
#   evidence  可选，指出依据（LSEG 描述、页面、文件）
#
# 证据来源（本机，只读）：catalog.sqlite contracts；
# lseg_data/artifacts/lseg_exchange_groups_20261109/{ric_catalog,source_ric_details}；
# HRD 文件 cme_causal_roll_inputs_20261023/hrd.csv。2026-11-16 整理，覆盖当时
# catalog 中没有中文名的 166 个 LSEG 品种和国内的 LR。

# ---------------------------------------------------------------- 规则
# prefix 后面紧跟 1–3 位数字时匹配；{n} 替换为去掉前导零的数字。
[[pattern]]
market = "lseg"
prefix = "VX"
name_cn = "VIX波动率指数期货（第{n}周到期）"
name_en = "Cboe VIX Futures (week {n} expiry)"
exchange = "CFE"
category = "波动率"
source = "industry_standard"
evidence = "LSEG 描述 'VOL IN WKnn' / 'VIX FUT'；VXnn 为按到期周编号的 VIX 期货 RIC"

[[pattern]]
market = "lseg"
prefix = "Cc"
name_cn = "CBOT玉米第{n}连续合约"
name_en = "CBOT Corn continuation #{n}"
exchange = "CBOT"
category = "农产品"
source = "derived_from_description"
evidence = "LSEG 描述 'cN Corn (Composite Trades) Nth Month'"

