# gRPC cn_market.v1 minute bars over the production baseline_data_1min archive.
listen = "0.0.0.0:18312"
baseline_root = "/mnt/hdd-raid5-72t/liang_torch/cn_futures_data/baseline_data_1min"
daily_state_file = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/cn_daily_state.json"
reference_api = "http://127.0.0.1:8765"
session_as_of = "2026-11-26"
metadata_refresh_s = 3600
# HTTP JSON dominant-contract lookup (not gRPC), intranet.
http_listen = "0.0.0.0:18313"
roll_dir = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/roll/result"

# The supervised cn-minute-cache child writes closed ZMQ baseline minutes.
[minute_cache]
directory = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/zmq_baseline_1min"
secondary_directory = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/zmq_baseline_1min_secondary"
zmq_endpoint = "tcp://10.61.20.12:13005"

# In-progress trading day rebuilt from the NFS MDL files (no DB, no ZMQ), all products: fills
# GetMinuteBars between the last archived day and what NFS has received.
# Bars are `provisional`; DataState.live_through_ms says how far NFS has caught up.
[live]
msg_root = "/mnt/nfs/30.3_tonglian_msg"
products = ["*"]
# Finished session segments (night / morning / afternoon) are computed once, written here and
# dropped from memory; the manifest lets a restart resume. Partial files of days that
# cn-daily has published are deleted automatically.
segment_dir = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/live_segments"
# Scheduled tail cut: a contract whose last row is at the end of a window followed
# by a break >= 30 min (lunch, close, night close; NOT the 15 min tea break) is
# persisted delay_s after that row once the files are caught up, cut at window end
# + tail_grace_s. tail_quiet_s (2 h) stays as the fallback.
delay_s = 600
tail_grace_s = 300
# Shared size-class threshold files (dominant contract by trading day, complete preceding
# month; the same files baseline_data_1min step 4 uses). A trade of month M is classed with
# month M-1's thresholds; a product without a file keeps its bars without size_buckets.
size_threshold_dir = "/mnt/nvme-raid0-28t/fanghaizhou/cn_futures_data/size_thresholds"
